# CI for bevy_speech_bubbles (canonical repository).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (standalone) + test
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # **The load-bearing step, and it is `build` rather than `test` deliberately.**
      #
      # `cargo test` compiles dev-dependencies, and this crate's dev-dependency is the FULL `bevy`
      # umbrella — the examples need a window and a camera, while the crate itself is trimmed to
      # asset, image, mesh, pbr, ui, text and picking. Cargo unifies features across a build, so under `cargo test` the
      # crate silently receives every Bevy feature there is, and a hole in its own `[dependencies]`
      # feature list cannot fail.
      #
      # The sibling crate `bevy_autogib` shipped exactly that hole: it named a type behind a feature it
      # never declared, every test passed, and the published crate did not compile for anyone. A plain
      # `cargo build` takes no dev-dependencies, so it compiles what a consumer actually gets.
      - name: Build with only the declared features
        run: cargo build

      # Includes `tests/leaf.rs`, the boundary ratchet, and the balloon-geometry tests that pin text
      # staying inside the rounded cap.
      - name: Test
        run: cargo test

      # The examples need a font at RUN time, not build time, so building them is the check that fits
      # in CI. Both refuse to start without a path rather than guessing one.
      - name: Build examples
        run: cargo build --examples
