# CI for the standalone `bevy_speech_bubbles` mirror.
#
# **This path is inert upstream and live here.** GitHub only reads workflows from `.github/` at a
# repository root, so in the monorepo this file is an ordinary text file that nothing runs. The
# `git subtree split` that produces the mirror lifts `crates/bevy_speech_bubbles/` to the root — and
# this file with it — so it becomes the mirror's CI without the monorepo gaining a second workflow.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (standalone) + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      # **The load-bearing step, and it is `build` rather than `test` deliberately.**
      #
      # `cargo test` compiles dev-dependencies, and this crate's dev-dependency is the FULL `bevy`
      # umbrella — the examples need a window and a 3D camera, while the crate itself is trimmed to
      # asset + image + mesh + pbr. Cargo unifies features across a build, so under `cargo test` the
      # crate silently receives every Bevy feature there is, and a hole in its own `[dependencies]`
      # feature list cannot fail.
      #
      # The sibling crate `bevy_autogib` shipped exactly that hole: it named a type behind a feature it
      # never declared, every test passed, and the published crate did not compile for anyone. A plain
      # `cargo build` takes no dev-dependencies, so it compiles what a consumer actually gets.
      - name: Build with only the declared features
        run: cargo build --release

      # Includes `tests/leaf.rs`, the boundary ratchet, and the balloon-geometry tests that pin text
      # staying inside the rounded cap.
      - name: Test
        run: cargo test

      # The examples need a font at RUN time, not build time, so building them is the check that fits
      # in CI. Both refuse to start without a path rather than guessing one.
      - name: Build examples
        run: cargo build --examples
