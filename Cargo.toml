[package]
name = "bevy_speech_bubbles"
version = "0.2.2"
edition = "2024"
rust-version = "1.97.1"
description = "Dialog kit for Bevy: world-space speech and thought balloons (CPU ab_glyph raster on a billboarded quad), a conversation graph and runtime, barks, and a skinnable screen dialog box."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_speech_bubbles"
keywords = ["bevy", "gamedev", "dialogue", "billboard", "text"]
categories = ["game-development"]
# `docs/` holds the chatter GIF, so it is out of the package.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]
# The umbrella with defaults off. The balloons need Image + StandardMaterial + Mesh + Transform; the
# screen dialog box needs bevy_ui + bevy_text (and bevy_picking for the choice rows and the clickable
# option balloons). Features unify with the game's full bevy, so this costs a consumer nothing.
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_asset",       # Assets<T>, Handle<T>, RenderAssetUsages
    "bevy_image",       # Image::new, ImageSampler, Extent3d / TextureDimension / TextureFormat
    "bevy_mesh",        # Rectangle -> Mesh for the quad
    "bevy_pbr",         # StandardMaterial: the unlit, alpha-blended balloon face
    "bevy_ui",          # the screen dialog box: Node, ImageNode, UiTransform, GlobalZIndex
    "bevy_text",        # Text, TextSpan, TextFont for the dialog box
    "bevy_picking",     # Pickable, PointerClick/Over for choices
    "bevy_log",         # warn!/error! for misconfiguration (a missing skin, an unknown speaker)
    "bevy_input_focus", # pulled by bevy_ui widgets; named so a lean host build keeps it
    "std",
] }
# Pure-Rust CPU glyph rasterization, no system deps. Bevy's text stack (parley/swash) has no public
# "rasterize a string into a standalone Image" API, and a world-space balloon has no 2D camera to host
# `Text2d` — so the text is baked to an RGBA image and sampled on a quad.
ab_glyph = "0.2"
# The conversation model is authored data: a host loads it from YAML or RON and may write it back.
serde = { version = "1", features = ["derive"] }
# Grapheme clusters (UAX #29): a word wider than a balloon line is broken between user-perceived
# characters, never inside an accent, a flag or an emoji sequence (UAX #14's emergency break). Pure Rust,
# no dependencies of its own.
unicode-segmentation = "1"

# **Tests and examples only.** The examples need a window, an event loop (winit) and the 3D camera
# pipeline, so they take the full umbrella here, where it cannot reach a consumer's dependency graph.
# `ron` parses the scripts in tests. `tests/leaf.rs` reads `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.20.0" }
ron = "0.12"
